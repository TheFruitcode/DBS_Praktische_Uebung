name: Java CI with Maven

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Code aus dem Repo auschecken
      - name: Checkout repository
        uses: actions/checkout@v3

      # Java 21 Setup
      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Maven Build
      - name: Build with Maven
        id: maven_build
        run: mvn clean install

      # Dependency-Action nur ausführen, wenn Maven erfolgreich war
      - name: Run Dependency Action
        if: success()
        run: |
          echo "Dependencies check or further actions go here"
          # Beispiel: mvn dependency:tree
